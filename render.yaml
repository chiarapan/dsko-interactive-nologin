services:
  - type: web
    name: dsko-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: CORS_ORIGINS
        value: "https://dsko-interactive-nologin-frontend.onrender.com"
      # Set DB_USER, DB_PASSWORD, DB_HOST, DB_PORT, DB_NAME in the Render dashboard secrets.

  - type: static_site
    name: dsko-frontend
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    publishPath: frontend/build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: "https://dsko-interactive-nologin.onrender.com"
